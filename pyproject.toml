[project]
name = "worker-env"
version = "0.1.0"
description = "Minimal secret vault on Cloudflare Workers with Python client and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "vgana"}
]
keywords = ["vault", "secrets", "cloudflare", "workers", "csv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.scripts]
vault = "worker_env.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_env"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "DTZ005",
    "EM101",
    "EM102",
    "FBT001",
    "FBT002",
    "TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG", "D", "PGH003", "PLR0913", "PLR2004", "S101", "S104", "S105", "S106"]
"src/worker_env/cli.py" = ["E501", "ERA001", "PLR0911", "PLR2004", "T201", "TRY300"]
"examples/*" = ["BLE001", "D", "INP001", "S106", "T201", "TRY300"]
"examples/basic_usage.py" = ["T201"]
"examples/environment_sync.py" = ["T201", "BLE001"]
"examples/error_handling.py" = ["T201", "TRY300"]
"worker/*.py" = ["ANN", "C901", "INP001", "PLR0911", "PLR2004", "PLW0603", "T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["worker_env"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
