name = "worker-env-vault"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Create the KV namespace first:
#   npx wrangler kv namespace create SECRETS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SECRETS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Bearer token for API authentication. Generate a secure random token:
#   openssl rand -base64 32
# The vault fails closed (every request returns 401) while this is empty.
# This is not a secret in the cryptographic sense, but should be treated
# as sensitive and rotated periodically.
VAULT_BEARER_TOKEN = ""

# Optional: Enable analytics tracking of secret access patterns.
# Set to "true" to track daily access counts per secret (30-day retention).
# VAULT_ENABLE_ANALYTICS = "false"

[observability]
enabled = true
