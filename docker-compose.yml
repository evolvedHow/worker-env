services:
  worker-env:
    build: .
    image: worker-env:local
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # 8000 is occupied on this homelab; keep the loopback port explicit.
      WORKER_ENV_HOST: 127.0.0.1
      WORKER_ENV_PORT: 8010
